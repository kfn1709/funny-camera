<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كاميرا مضحكة</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #075e54;
            color: white;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        #camera {
            width: 100%;
            max-width: 400px;
            height: 300px;
            margin: 20px auto;
            border: 3px solid white;
            border-radius: 10px;
            background-color: #128c7e;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 50px;
        }
        #result {
            width: 100%;
            max-width: 400px;
            margin: 20px auto;
            border: 3px solid white;
            border-radius: 10px;
            display: none;
        }
        button {
            background-color: #25D366;
            color: white;
            border: none;
            padding: 12px 25px;
            margin: 10px;
            border-radius: 5px;
            font-size: 18px;
            cursor: pointer;
        }
        .flash {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: white;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }
        .cow-text {
            font-size: 24px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <h1>كاميرا الواتساب المضحكة</h1>
    <p id="status">جارٍ تحميل الكاميرا...</p>
    
    <div id="camera">🎥</div>
    <canvas id="result"></canvas>
    
    <div id="controls" style="display:none;">
        <button id="captureBtn">التقاط صورة</button>
    </div>
    
    <div class="flash" id="flash"></div>

    <script>
        // محاكاة تحميل الكاميرا
        setTimeout(() => {
            document.getElementById('status').textContent = "الكاميرا جاهزة!";
            document.getElementById('controls').style.display = 'block';
        }, 1500);

        // عند النقر على التقاط صورة
        document.getElementById('captureBtn').addEventListener('click', function() {
            // تأثير فلاش
            const flash = document.getElementById('flash');
            flash.style.opacity = 0.9;
            
            setTimeout(() => {
                flash.style.opacity = 0;
                
                // عرض صورة البقرة المضحكة
                const camera = document.getElementById('camera');
                const result = document.getElementById('result');
                
                camera.style.display = 'none';
                result.style.display = 'block';
                document.getElementById('controls').style.display = 'none';
                document.getElementById('status').textContent = "تم التقاط صورتك المضحكة!";
                
                // رسم صورة البقرة المضحكة
                const ctx = result.getContext('2d');
                result.width = 400;
                result.height = 300;
                
                // خلفية خضراء
                ctx.fillStyle = '#075e54';
                ctx.fillRect(0, 0, result.width, result.height);
                
                // رسم وجه بقرة
                ctx.fillStyle = 'white';
                
                // وجه البقرة
                ctx.beginPath();
                ctx.ellipse(200, 150, 100, 80, 0, 0, Math.PI * 2);
                ctx.fill();
                
                // عيون
                ctx.fillStyle = 'black';
                ctx.beginPath();
                ctx.arc(170, 130, 15, 0, Math.PI * 2);
                ctx.arc(230, 130, 15, 0, Math.PI * 2);
                ctx.fill();
                
                // فم
                ctx.beginPath();
                ctx.arc(200, 170, 30, 0, Math.PI);
                ctx.stroke();
                
                // قرون
                ctx.strokeStyle = 'black';
                ctx.lineWidth = 5;
                ctx.beginPath();
                ctx.moveTo(150, 80);
                ctx.lineTo(130, 50);
                ctx.moveTo(250, 80);
                ctx.lineTo(270, 50);
                ctx.stroke();
                
                // أذنين
                ctx.beginPath();
                ctx.ellipse(150, 100, 20, 30, Math.PI/4, 0, Math.PI * 2);
                ctx.ellipse(250, 100, 20, 30, -Math.PI/4, 0, Math.PI * 2);
                ctx.fillStyle = 'pink';
                ctx.fill();
                
                // نص تحت الصورة
                ctx.font = '20px Arial';
                ctx.fillStyle = 'white';
                ctx.textAlign = 'center';
                ctx.fillText('مووووووووو!', 200, 280);
                
                // توجيه إلى واتساب بعد 3 ثواني
                setTimeout(() => {
                    window.location.href = "https://wa.me/qr/SILYIOC362CBA1";
                }, 3000);
                
            }, 200);
        });
    </script>
</body>
</html>
